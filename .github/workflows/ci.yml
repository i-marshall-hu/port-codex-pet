name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Python lint
        run: uvx ruff check skills/port-codex-pet/scripts skills/port-codex-pet/tests

      - name: Python format
        run: uvx ruff format --check skills/port-codex-pet/scripts skills/port-codex-pet/tests

      - name: Unit tests
        run: python3 -m unittest discover -s skills/port-codex-pet/tests -v

      - name: Coverage
        run: |
          uvx coverage run --branch --source=skills/port-codex-pet/scripts \
            -m unittest discover -s skills/port-codex-pet/tests
          uvx coverage report --show-missing --fail-under=80

      - name: Runtime syntax
        run: node --check skills/port-codex-pet/assets/runtime/codex-pet-player.js
